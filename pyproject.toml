[build-system]
requires = ["setuptools>=64", "wheel", "pybind11>=2.11"]
build-backend = "setuptools.build_meta"

[project]
name = "dmkde"
version = "0.1.1"
description = "Density-matrix kernel density estimation for anomaly detection (C++ core)."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "EmpowerTours" }]
requires-python = ">=3.9"
dependencies = ["numpy>=1.20"]
keywords = ["anomaly-detection", "density-matrix", "quantum-machine-learning",
            "kernel-density", "fraud-detection"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Financial and Insurance Industry",
]

[project.urls]
Homepage = "https://github.com/EmpowerTours/libdmkde"
Repository = "https://github.com/EmpowerTours/libdmkde"

[tool.setuptools]
package-dir = { "" = "python" }

[tool.setuptools.packages.find]
where = ["python"]
include = ["dmkde*"]

[tool.cibuildwheel]
build-verbosity = 1
# Build deps come from [build-system] (isolated `build` frontend).
build-frontend = "build"
# Run the full test suite against every built wheel before it can be
# published. pyod / qiskit tests skip when those extras are not installed.
test-requires = ["pytest", "hypothesis", "scikit-learn"]
test-command = "pytest {project}/tests -q -p no:cacheprovider"

[tool.cibuildwheel.linux]
before-all = "yum install -y gcc-c++ || apt-get install -y g++ || true"
# Test deps: numpy/scipy/scikit-learn wheels only. Their newest releases ship cp311+ wheels for
# manylinux_2_27/2_28 only, so on the manylinux2014 image pip would compile scipy from source (and fail
# without OpenBLAS). Binary-only picks the newest manylinux2014-compatible versions instead.
environment = { PIP_ONLY_BINARY = "numpy,scipy,scikit-learn" }
